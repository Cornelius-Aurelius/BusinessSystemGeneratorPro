<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BusinessOS — Dashboard</title>

<style>
:root {
  --accent: #4aa8ff;
  --radius: 14px;
  --transition: 0.25s;

  --light-bg: #f4f6fa;
  --light-fg: #1a1d26;
  --light-card: #ffffff;
  --light-border: rgba(0,0,0,0.1);

  --dark-bg: #0e1117;
  --dark-fg: #e8ecf2;
  --dark-card: #161b22;
  --dark-border: rgba(255,255,255,0.08);
}

body {
  margin: 0;
  font-family: system-ui, Inter, sans-serif;
  transition: var(--transition);
}

/* THEMING */
body.light {
  background: var(--light-bg);
  color: var(--light-fg);
}
body.light .card {
  background: var(--light-card);
  border: 1px solid var(--light-border);
}
body.light .sidebar {
  background: #ffffff;
  border-right: 1px solid var(--light-border);
}

body.dark {
  background: var(--dark-bg);
  color: var(--dark-fg);
}
body.dark .card {
  background: var(--dark-card);
  border: 1px solid var(--dark-border);
}
body.dark .sidebar {
  background: #11151d;
  border-right: 1px solid var(--dark-border);
}

/* LAYOUT */
.layout {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 240px;
  padding: 2rem 1rem;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  overflow-y: auto;
}

.sidebar h2 {
  font-size: 1.4rem;
  margin-bottom: 2rem;
  padding-left: 0.8rem;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: 0.8rem 1rem;
  border-radius: var(--radius);
  text-decoration: none;
  color: inherit;
  margin-bottom: 0.4rem;
  transition: var(--transition);
}
.nav-link:hover {
  background: rgba(74,168,255,0.15);
  color: var(--accent);
}

.main {
  margin-left: 240px;
  padding: 2rem;
  width: calc(100% - 240px);
}

/* CARDS */
.card {
  padding: 2rem;
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
}

.flex {
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem;
}

.card-half {
  flex: 1 1 calc(50% - 1.5rem);
}

.card-third {
  flex: 1 1 calc(33% - 1.5rem);
}

/* INPUT */
input {
  width: 100%;
  padding: 0.8rem;
  font-size: 1rem;
  border-radius: var(--radius);
  border: none;
  margin-top: 0.8rem;
}

button {
  margin-top: 1rem;
  padding: 0.8rem 1rem;
  background: var(--accent);
  border: none;
  color: #fff;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  transition: var(--transition);
}
button:hover { opacity: 0.85; }

@media (max-width: 900px) {
  .sidebar {
    left: -260px;
  }
  .sidebar.open {
    left: 0;
  }
  .main {
    margin-left: 0;
    width: 100%;
  }
  .menu-btn {
    display: inline-block;
    padding: 0.5rem 1rem;
    background: var(--accent);
    border-radius: var(--radius);
    color: #fff;
    font-weight: 600;
    margin-bottom: 1rem;
  }
}
</style>
</head>

<body>

<script>
if (localStorage.getItem("theme")) {
  document.body.className = localStorage.getItem("theme");
} else {
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.body.className = prefersDark ? "dark" : "light";
}
</script>

<div class="layout">

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <h2>BusinessOS</h2>
    <a href="index.html" class="nav-link">🏠 Home</a>
    <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
    <a href="tools.html" class="nav-link">🧰 Tools</a>
    <a href="brandkit.html" class="nav-link">🎨 Brand Kit</a>
    <a href="planner.html" class="nav-link">🗓 Planner</a>
    <a href="workspace.html" class="nav-link">📁 Workspace</a>
    <a href="settings.html" class="nav-link">⚙️ Settings</a>
  </nav>

  <!-- MAIN -->
  <main class="main">

    <div class="menu-btn" onclick="toggleMenu()">☰ Menu</div>

    <h1>Dashboard</h1>
    <p>Your key business numbers, calculators, and quick insights.</p>

    <!-- KPI CARDS -->
    <div class="flex">
      <div class="card card-third">
        <h2>Monthly Revenue</h2>
        <input id="rev" type="number" placeholder="Enter revenue" />
        <p id="rev-display"></p>
      </div>

      <div class="card card-third">
        <h2>Monthly Expenses</h2>
        <input id="exp" type="number" placeholder="Enter expenses" />
        <p id="exp-display"></p>
      </div>

      <div class="card card-third">
        <h2>Net Profit</h2>
        <p id="profit-display" style="font-size:1.6rem; margin-top:2rem;">£0</p>
      </div>
    </div>

    <!-- PROJECTION TOOL -->
    <div class="card">
      <h2>12-Month Projection</h2>
      <input id="growth" type="number" placeholder="Expected monthly growth % (e.g. 8)" />
      <button onclick="calculateProjection()">Generate Projection</button>
      <p id="projection-output" style="margin-top:1rem; white-space:pre-wrap;"></p>
    </div>

    <!-- FOOTER -->
    <footer style="margin-top:3rem; opacity:0.4;">
      Designed by <strong>Cornelius Aurelius</strong>
    </footer>

  </main>
</div>

<script>
function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
}

/* Update KPI displays dynamically */
document.getElementById("rev").addEventListener("input", updateKPI);
document.getElementById("exp").addEventListener("input", updateKPI);

function updateKPI() {
  const rev = Number(document.getElementById("rev").value || 0);
  const exp = Number(document.getElementById("exp").value || 0);

  document.getElementById("rev-display").textContent = "£" + rev.toLocaleString();
  document.getElementById("exp-display").textContent = "£" + exp.toLocaleString();
  document.getElementById("profit-display").textContent = "£" + (rev - exp).toLocaleString();
}

/* Projection calculator */
function calculateProjection() {
  const rev = Number(document.getElementById("rev").value || 0);
  const growth = Number(document.getElementById("growth").value || 0);

  let output = "";
  let current = rev;

  for (let m = 1; m <= 12; m++) {
    current = current + (current * (growth / 100));
    output += `Month ${m}: £${current.toLocaleString()}\n`;
  }

  document.getElementById("projection-output").textContent = output;
}
</script>

</body>
</html>
