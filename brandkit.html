<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BusinessOS — Brand Kit</title>

<style>
:root {
  --accent: #4aa8ff;
  --radius: 14px;
  --transition: 0.25s;

  --light-bg: #f4f6fa;
  --light-fg: #1a1d26;
  --light-card: #ffffff;
  --light-border: rgba(0,0,0,0.1);

  --dark-bg: #0e1117;
  --dark-fg: #e8ecf2;
  --dark-card: #161b22;
  --dark-border: rgba(255,255,255,0.08);
}

body {
  margin: 0;
  font-family: system-ui, Inter, sans-serif;
  transition: var(--transition);
}

/* THEMING */
body.light {
  background: var(--light-bg);
  color: var(--light-fg);
}
body.light .card {
  background: var(--light-card);
  border: 1px solid var(--light-border);
}
body.light .sidebar {
  background: #ffffff;
  border-right: 1px solid var(--light-border);
}

body.dark {
  background: var(--dark-bg);
  color: var(--dark-fg);
}
body.dark .card {
  background: var(--dark-card);
  border: 1px solid var(--dark-border);
}
body.dark .sidebar {
  background: #11151d;
  border-right: 1px solid var(--dark-border);
}

/* Layout */
.layout {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 240px;
  padding: 2rem 1rem;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  overflow-y: auto;
}

.sidebar h2 {
  font-size: 1.4rem;
  margin-bottom: 2rem;
  padding-left: 0.8rem;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  text-decoration: none;
  padding: 0.8rem 1rem;
  border-radius: var(--radius);
  color: inherit;
  margin-bottom: 0.4rem;
  transition: var(--transition);
}
.nav-link:hover {
  background: rgba(74,168,255,0.15);
  color: var(--accent);
}

.main {
  margin-left: 240px;
  padding: 2rem;
  width: calc(100% - 240px);
}

/* Cards */
.card {
  padding: 2rem;
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
}

/* Swatches */
.swatch-container {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin-top: 1rem;
}

.swatch {
  width: 70px;
  height: 70px;
  border-radius: var(--radius);
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.2);
  transition: var(--transition);
}

.swatch:hover {
  transform: scale(1.07);
  border-color: var(--accent);
}

/* Inputs */
input {
  width: 100%;
  padding: 0.8rem;
  margin-top: 0.8rem;
  border-radius: var(--radius);
  border: none;
  background: rgba(255,255,255,0.07);
  color: inherit;
}

button {
  margin-top: 1rem;
  padding: 0.8rem 1rem;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  transition: var(--transition);
}
button:hover { opacity: 0.85; }

.output {
  margin-top: 1rem;
  white-space: pre-wrap;
  background: rgba(255,255,255,0.07);
  padding: 1rem;
  border-radius: var(--radius);
}

/* Mobile */
@media (max-width: 900px) {
  .sidebar {
    left: -260px;
  }
  .sidebar.open {
    left: 0;
  }
  .main {
    margin-left: 0;
    width: 100%;
  }
  .menu-btn {
    display: inline-block;
    padding: 0.5rem 1rem;
    background: var(--accent);
    border-radius: var(--radius);
    color: #fff;
    margin-bottom: 1rem;
    cursor: pointer;
  }
}
</style>
</head>

<body>

<script>
if (localStorage.getItem("theme")) {
  document.body.className = localStorage.getItem("theme");
} else {
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.body.className = prefersDark ? "dark" : "light";
}
</script>

<div class="layout">

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <h2>BusinessOS</h2>
    <a href="index.html" class="nav-link">🏠 Home</a>
    <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
    <a href="tools.html" class="nav-link">🧰 Tools</a>
    <a href="brandkit.html" class="nav-link">🎨 Brand Kit</a>
    <a href="planner.html" class="nav-link">🗓 Planner</a>
    <a href="workspace.html" class="nav-link">📁 Workspace</a>
    <a href="settings.html" class="nav-link">⚙️ Settings</a>
  </nav>

  <!-- MAIN -->
  <main class="main">

    <div class="menu-btn" onclick="toggleMenu()">☰ Menu</div>

    <h1>Brand Kit Creator</h1>
    <p>Generate a complete branding system with color palettes, messaging, tone, and typography.</p>

    <!-- BRAND NAME -->
    <div class="card">
      <h2>Brand Name</h2>
      <input id="brand-name-input" placeholder="Enter brand name..." />
      <button onclick="generateBrandKit()">Generate Brand Kit</button>
      <div id="brandkit-output" class="output"></div>
    </div>

    <!-- COLOR PALETTE -->
    <div class="card">
      <h2>Color Palette</h2>
      <button onclick="generatePalette()">Generate 5-Color Palette</button>
      <div id="palette" class="swatch-container"></div>
    </div>

    <footer style="margin-top:2rem; opacity:0.4;">
      Designed by <strong>Cornelius Aurelius</strong>
    </footer>

  </main>
</div>

<script>
function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("open");
}

/* BRAND KIT TEXT */
function generateBrandKit() {
  const name = document.getElementById("brand-name-input").value || "Your Brand";
  const fonts = ["Inter", "Montserrat", "Poppins", "Lato", "Nunito"];

  const out = `
BRAND NAME
${name}

BRAND PERSONALITY
• Confident
• Clean
• Professional
• Modern
• Helpful

TONE & VOICE
• Clear and direct
• Trust-building
• Informative
• Customer-first

TYPOGRAPHY
Primary font: ${fonts[Math.floor(Math.random()*fonts.length)]}

BRAND MESSAGE
${name} stands for clarity, simplicity, and high-impact value.
`;

  document.getElementById("brandkit-output").textContent = out;
}

/* COLOR PALETTE */
function generatePalette() {
  const container = document.getElementById("palette");
  container.innerHTML = "";

  for (let i = 0; i < 5; i++) {
    const color = "#" + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
    const swatch = document.createElement("div");
    swatch.className = "swatch";
    swatch.style.background = color;
    swatch.title = "Click to copy";

    swatch.onclick = () => {
      navigator.clipboard.writeText(color);
      swatch.style.borderColor = "#4aa8ff";
      setTimeout(() => swatch.style.borderColor = "rgba(255,255,255,0.2)", 600);
    };

    container.appendChild(swatch);
  }
}
</script>

</body>
</html>
